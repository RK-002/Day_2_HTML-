<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .apply-button {
            background-color:rgb(10, 102, 194);
            color: white;
            border: none;
            font-weight: bold;
            width: 220px;
            height: 40px;
            border-radius: 30px;
            margin-right: 10px;
            cursor: pointer;

        }
        .save-button {
            background-color: white;
            color:rgb(10, 102, 194);
            border: solid 1px;
            font-weight: bold;
            width: 100px;
            height: 40px;
            border-radius: 30px;
            cursor: pointer;

        }
    </style>
</head>
<body>
    <button class="apply-button">Apply on company website</button>
    <button class="save-button">Save</button>
</body>
</html>
