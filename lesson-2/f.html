<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .amaz-link {
            color: rgb(0, 113, 133);
            
        }
        .price {
            color: rgb(0, 118, 0);
            
        }
        .button {
            cursor: pointer;
            color: black;
            border: none;
            
            width: 125px;
            height: 30px;
            border-radius: 30px;
        }
        #cart{
            background-color: rgb(255, 216, 20);
            margin-right: 5px;
        }
        #buy{
            background-color: rgb(255, 164, 28);
        }
        
    </style>
</head>
<body>
    <a href="https://www.amazon.in/" class="amaz-link">Back to Amazon</a>
    <h2>Nike black running shoes</h2>
    
    <p class="price">Rs.5000 - in stock.</p>
    <p>Free delivery tomorrow.</p>
    <button class="button" id="cart">Add to cart</button>
    <button class="button" id="buy">Buy now</button>
</body>
</html>
